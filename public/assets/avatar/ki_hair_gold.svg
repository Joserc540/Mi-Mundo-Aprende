      <stop offset="0%" stop-color="#FFF380"/>
      <stop offset="55%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
